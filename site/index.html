<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAM's Garage</title>
<meta name="description" content="SAM's Garage (Sg): search every open and upcoming U.S. federal SBIR/STTR topic and solicitation (DoD, NIH, NSF, DOE, NASA, USDA and more), refreshed daily. Works offline.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="SAM's Garage">
<meta property="og:title" content="SAM's Garage (Sg)">
<meta property="og:description" content="Every open and upcoming U.S. federal SBIR/STTR topic and solicitation in one fast, searchable app, refreshed daily. Web, offline and desktop.">
<meta property="og:url" content="https://lcintron.github.io/sams-garage/">
<meta property="og:image" content="https://lcintron.github.io/sams-garage/icons/social-1280x640.png">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="640">
<meta property="og:image:alt" content="SAM's Garage: every open and upcoming SBIR/STTR topic, refreshed daily">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="SAM's Garage (Sg)">
<meta name="twitter:description" content="Every open and upcoming U.S. federal SBIR/STTR topic and solicitation, refreshed daily.">
<meta name="twitter:image" content="https://lcintron.github.io/sams-garage/icons/social-1280x640.png">
<meta name="theme-color" content="#0b1118">
<meta name="color-scheme" content="dark light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sg">
<script>
  // Apply the saved theme before first paint (no flash). Dark is the default unless the system asks for light.
  try {
    var p = JSON.parse(localStorage.getItem('sg.prefs') || localStorage.getItem('sbir.prefs') || '{}'); // sbir.: before the rename (js/store.js migrates it)
    if (p.theme === 'light' || p.theme === 'dark') document.documentElement.dataset.theme = p.theme;
    if (p.filtersCollapsed) document.documentElement.classList.add('filters-collapsed');
  } catch (e) { /* storage blocked: follow the system */ }
  // Desktop app: the top bar is also the window's title bar (css: html[data-titlebar]; electron/preload.js).
  if (window.sgDesktop && window.sgDesktop.titleBar) document.documentElement.dataset.titlebar = window.sgDesktop.titleBar;
</script>
<link rel="stylesheet" href="css/app.css">
<link rel="modulepreload" href="js/app.js">
<script type="module" src="js/app.js"></script>
</head>
<body>
<a class="skip-link" href="#list" id="skipLink">Skip to results</a>
<div id="app">
  <header id="topbar">
    <button id="filtersBtn" class="icon-btn" type="button" title="Filters" aria-label="Show filters" aria-controls="filters" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 5h16l-6 7.5V19l-4 2v-8.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <span class="badge hidden" id="filtersBadge"></span>
    </button>
    <a class="brand" href="#/" title="SAM's Garage — all results" aria-label="SAM's Garage, all results">
      <img class="logo" src="icons/icon.svg" alt="" width="28" height="28">
      <span class="brand-name">SAM's <span class="brand-accent">Garage</span></span>
    </a>

    <div class="search-wrap" role="search">
      <svg viewBox="0 0 24 24" width="18" height="18" class="search-icon" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Search titles, keywords, topic numbers…" aria-label="Search solicitations" autocomplete="off" spellcheck="false" enterkeyhint="search">
      <kbd class="search-kbd" aria-hidden="true">/</kbd>
    </div>

    <div class="topbar-right">
      <a id="freshness" class="pill freshness" href="#/about" title="Data freshness">
        <span class="dot" aria-hidden="true"></span><span class="txt">Loading…</span>
      </a>
      <nav class="nav" aria-label="Views">
        <a href="#/watch" id="navWatch" class="icon-btn" title="Watchlist" aria-label="Watchlist">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          <span class="badge hidden" id="watchBadge"></span>
        </a>
        <a href="#/sql" id="navSql" class="icon-btn" title="SQL console" aria-label="SQL console">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="2.8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 6v12c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8V6M5 12c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        </a>
        <a href="#/notify" id="navNotify" class="icon-btn" title="Notifications" aria-label="Notifications">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2H4.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 20.5a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </a>
        <a href="#/about" id="navAbout" class="icon-btn" title="About and data sources" aria-label="About">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="7.6" r="1.2" fill="currentColor"/></svg>
        </a>
      </nav>
      <button id="installBtn" class="btn small primary hidden" type="button" title="Install SAM's Garage as an app">Install</button>
      <button id="themeBtn" class="icon-btn" type="button" title="Switch to light theme" aria-label="Switch to light theme">
        <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <div id="main" data-view="list">
    <aside id="filters" aria-label="Filters">
      <div class="filters-head">
        <h2>Filters</h2>
        <button id="filtersReset" class="btn small ghost" type="button">Reset</button>
        <button id="filtersClose" class="icon-btn mini" type="button" title="Hide filters" aria-label="Hide filters">&times;</button>
      </div>
      <div id="filtersBody" class="filters-body"><p class="dim pad">Loading filters…</p></div>
    </aside>

    <section id="results" aria-label="Results">
      <div id="statsbar" class="statsbar">
        <h1 id="listTitle" class="list-title">Opportunities</h1>
        <span id="resultCount" class="count" role="status" aria-live="polite" aria-atomic="true">Loading…</span>
        <span id="indexState" class="index-state dim" aria-hidden="true"></span>
        <div class="stats-right">
          <label class="sr-only" for="sortSel">Sort by</label>
          <select id="sortSel" title="Sort by"></select>
          <div class="menu-wrap">
            <button id="exportBtn" class="btn small" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="exportMenu" title="Export current results">Export ▾</button>
            <div id="exportMenu" class="dropdown menu hidden" role="menu">
              <button type="button" role="menuitem" data-export="csv">CSV (spreadsheet)</button>
              <button type="button" role="menuitem" data-export="json">JSON</button>
            </div>
          </div>
        </div>
      </div>
      <div id="activeChips" class="active-chips" aria-label="Active filters"></div>
      <div id="list" class="list" role="list" aria-labelledby="listTitle" tabindex="-1">
        <div class="skeleton" aria-hidden="true"></div><div class="skeleton" aria-hidden="true"></div><div class="skeleton" aria-hidden="true"></div>
      </div>
    </section>

    <section id="detail" class="detail" aria-label="Topic detail">
      <div class="detail-empty dim">
        <svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true"><path d="M6 3h9l4 4v14H6z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M9 10h7M9 13h7M9 16h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <p>Select a topic to see its details.</p>
        <p class="small">Keys: <kbd>/</kbd> search · <kbd>↑</kbd><kbd>↓</kbd> move · <kbd>Enter</kbd> open · <kbd>Esc</kbd> close</p>
      </div>
    </section>

    <section id="sqlView" class="view hidden" aria-label="SQL console"></section>
    <section id="aboutView" class="view hidden" aria-label="About"></section>
    <section id="notifyView" class="view hidden" aria-label="Notifications"></section>
  </div>

  <div id="scrim" class="scrim hidden"></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
</div>
<noscript><p class="noscript">SAM's Garage needs JavaScript to search the data.</p></noscript>
</body>
</html>
