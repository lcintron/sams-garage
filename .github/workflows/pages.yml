name: Deploy site

# Publishes GitHub Pages on demand: a release's code (the latest release tag by default, or the tag or branch
# given) with today's data (data/ on main), assembled by scripts/assemble-site.sh. The Release workflow already
# deploys the site for every release and scrape.yml redeploys it with fresh data every day; use this to redeploy
# an older tag, or to deploy without releasing.
# Repository setting required once: Settings -> Pages -> Source: "GitHub Actions".
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or branch whose code to deploy (empty = the latest release tag)
        required: false
        default: ''

env:
  # The public site's address (link previews, the desktop app's shared links): scripts/site-url.sh.
  # Change to https://sg.luiscintron.com/ once the custom domain is set up in Settings -> Pages.
  SITE_URL: https://lcintron.github.io/sams-garage/

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.ref || 'the latest release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0   # every tag and the newest main, for scripts/assemble-site.sh
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Check input
        # The input reaches the shell only through an env var and is allowlisted here.
        env:
          REF: ${{ inputs.ref }}
        run: |
          if [ -n "$REF" ] && { [[ ! "$REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,99}$ ]] || ! git check-ref-format --allow-onelevel "$REF"; }; then
            echo "::error::Not a tag or branch name: '$REF'."
            exit 1
          fi
          if [ -n "$REF" ] && ! git rev-parse -q --verify "refs/tags/$REF^{commit}" >/dev/null \
             && ! git rev-parse -q --verify "refs/remotes/origin/$REF^{commit}" >/dev/null; then
            echo "::error::No tag or branch '$REF' in this repository."
            exit 1
          fi
      - name: Assemble site (release code + today's data)
        env:
          REF: ${{ inputs.ref }}
        run: |
          code=""
          if [ -n "$REF" ]; then
            if git rev-parse -q --verify "refs/tags/$REF^{commit}" >/dev/null; then code="refs/tags/$REF"; else code="origin/$REF"; fi
          fi
          bash scripts/assemble-site.sh "$code" origin/main _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
