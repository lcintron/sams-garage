name: CI

# Offline checks on every push and pull request: scraper unit tests (saved fixtures, no network),
# a schema check and a build smoke test of the committed database, a dry run of the Pages assembly, the
# site's node tests (including the desktop app's app:// handler), and syntax checks of the desktop app and
# the release scripts.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Scraper tests and build smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the release tags, for the released-scraper check below
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: pytest
        run: pytest -q
      - name: Validate committed data
        run: python -m scraper validate
      - name: Build smoke test
        run: python -m scraper build --out "$RUNNER_TEMP/site-data"
      - name: Site assembly smoke test
        # What every Pages deploy runs (here with this commit as both the code and the data).
        env:
          ASSEMBLE_NO_PIP: '1'
        run: |
          bash scripts/assemble-site.sh HEAD HEAD "$RUNNER_TEMP/_site"
          test -s "$RUNNER_TEMP/_site/data/catalog.json"
          test -s "$RUNNER_TEMP/_site/VERSION.txt"
          test ! -e "$RUNNER_TEMP/_site/tests" && test ! -e "$RUNNER_TEMP/_site/package.json"
      - name: The released scraper still builds this data
        # The live site is the latest release's code with the newest data, built by that release's scraper
        # (scripts/assemble-site.sh). A change to data/ that the released scraper cannot build must wait for a
        # release; this catches it here instead of in the daily deploy. Skipped until the first release.
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v*' --exclude 'v*-*' HEAD 2>/dev/null || true)
          if [ -z "$tag" ]; then
            echo "No release tag yet: nothing to check."
            exit 0
          fi
          bash scripts/assemble-site.sh "$tag" HEAD "$RUNNER_TEMP/_released"
          test -s "$RUNNER_TEMP/_released/data/catalog.json"

  node:
    name: Site tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false   # no lock file; the tests need no npm install
      - name: node --test
        run: npm test
      - name: Syntax checks (desktop app and scripts)
        run: |
          bash -n scripts/assemble-site.sh
          for f in electron/*.js scripts/*.js; do node --check "$f"; done
